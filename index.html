<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="비앤빛안과 — 내 눈에 맞는 시력교정 수술 찾기와 상담·검사 예약."
    />
    <title>비앤빛안과 — 내 눈에는 어떤 수술이 맞을까요?</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #fff;
      }

      body.frontpage-mode {
        overflow: hidden;
      }

      .frontpage {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }

      .proto-link {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 2147483647;
        font: 12px/1
          -apple-system,
          BlinkMacSystemFont,
          "Pretendard Variable",
          sans-serif;
        color: #6b7280;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 999px;
        padding: 7px 12px;
        text-decoration: none;
        opacity: 0.45;
        transition: opacity 0.15s ease;
      }

      .proto-link:hover,
      .proto-link:focus-visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- SPA 마운트 지점. 와이어프레임 모드에서는 비어 있는 채로 둡니다. -->
    <div id="root"></div>

    <noscript>
      <p style="font: 14px/1.6 sans-serif; padding: 24px">
        이 페이지는 JavaScript가 필요합니다.
        <a href="./frontpage.html">와이어프레임 직접 열기</a>
      </p>
    </noscript>

    <script>
      // 이 저장소는 Vite 빌드 산출물 배포 전용이고, SPA 라우터는
      // basename="/bnviit-rebuild" 로 고정돼 있습니다. 즉 SPA 홈은 pathname이
      // 정확히 "/bnviit-rebuild/" 일 때만 매칭됩니다 — 신규 와이어프레임이
      // 차지한 바로 그 주소입니다. 그래서 경로를 나누는 대신 같은 경로에서
      // 쿼리로 분기시킵니다. pathname 이 그대로라 SPA 라우팅과 딥링크가
      // 전부 원래대로 동작합니다.
      //
      //   /bnviit-rebuild/        → 신규 와이어프레임 (기본)
      //   /bnviit-rebuild/?spa    → 기존 React 프로토타입 홈
      //   /bnviit-rebuild/booking → 404.html 폴백 경유로 기존 프로토타입 (변경 없음)
      (function () {
        var SPA_BASE = "/bnviit-rebuild";
        var SPA_JS = SPA_BASE + "/assets/index-Bjtsl29Z.js";
        var SPA_CSS = SPA_BASE + "/assets/index-CAh33gx4.css";
        var FONT_CSS =
          "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css";

        // ── 와이어프레임 라벨 → 기존 프로토타입 라우트 ──────────────────────
        //
        // frontpage.html 은 재생성되는 내보내기 산출물이라 직접 손대지 않고,
        // 부모 문서에서 클릭을 가로채 기존 페이지로 넘깁니다. 여기 없는 라벨은
        // 와이어프레임 자체 화면으로 그대로 이동합니다.
        //
        // 라우트 이름은 SPA 번들의 BNVIIT_SITE_MENU 정의를 그대로 따랐습니다.
        var LINKS = {
          // 비앤빛안과 — 병원 · 의료시스템 · 브랜드
          원장단: "/bnviit/doctors",
          "AI 검사": "/bnviit/ai",
          "검사 프로세스": "/bnviit/ai",
          장비: "/bnviit/ai",
          "AI 진단": "/bnviit/ai",
          "수술 종류별 장비": "/bnviit/surgery",
          "사후케어 · 앱": "/bnviit/aftercare",
          공지사항: "/bnviit/news",
          뉴스: "/bnviit/news",
          유튜브: "/bnviit/onair",
          "연혁 (시작과 성장)": "/bnviit/history",
          "수상 내역": "/bnviit/research",
          "연구 협력사": "/bnviit/research",
          "연구 · 논문": "/bnviit/papers",
          "후기 등록": "/mypage/review",

          // 시력교정
          스마일라식: "/vision-correction/smilelasik",
          렌즈삽입술: "/vision-correction/icl",
          KPL: "/vision-correction/icl",
          "EVO ICL": "/vision-correction/icl",
          ECHO: "/vision-correction/icl",
          퍼스널아이즈: "/vision-correction/personaleyes",
          라식: "/vision-correction/lasik",
          라섹: "/vision-correction/lasik",
          "라식 · 라섹": "/vision-correction/lasik",
          각막강화술: "/vision-correction/xtra",
          모노비전: "/vision-correction/mono",
          프레스비욘드: "/vision-correction/presby",
          "EVO VIVA ICL": "/vision-correction/presby",
          노안교정: "/vision-correction/presby",
          "가까운 글씨가 흐려요": "/vision-correction/presby",

          // 전문분야 — 백내장 · 드림렌즈 · 검진 · 안질환
          "LAL 백내장 수술": "/specialty",
          "레이저 백내장 수술": "/specialty",
          "프리미엄 렌즈": "/specialty",
          "다초점 · 연속초점 · 단초점": "/specialty",
          백내장: "/specialty",
          드림렌즈: "/specialty",
          PARAGON: "/specialty",
          LK: "/specialty",
          PRGP: "/specialty",
          안종합검진: "/specialty",
          "기본 프로그램": "/specialty",
          "프리미엄 프로그램": "/specialty",
          안질환: "/specialty",
          안구건조증: "/specialty",
          IPL: "/specialty",
          리피플로우: "/specialty",
          망막질환: "/specialty",
          황반변성: "/specialty",
          비문증: "/specialty",
          당뇨망막증: "/specialty",
          "망막동맥 · 정맥폐쇄": "/specialty",
          녹내장: "/specialty",
          "눈앞이 뿌옇게 보여요": "/specialty",
          "눈이 건조하고 시려요": "/specialty",
          "날파리가 떠다녀요": "/specialty",
          "아이 시력이 걱정돼요": "/specialty",
          "증상은 없지만 검진받고 싶어요": "/specialty",

          // 상담 · 이용
          "제휴 고객 상담": "/booking/partner",
          "전화 상담 1600-0000": "/booking/consult",
          마이페이지: "/mypage",
          "로그인 · 회원가입": "/login",
        };

        // 라벨이 겹쳐서 그것만으로는 목적지를 못 정하는 항목입니다.
        // 홈에는 '더보기' 가 셋 있고 (고객 후기 · 이벤트 · 뉴스 · 공지),
        // 앞의 둘은 와이어프레임에 디자인된 화면이 있어 그대로 두고
        // 뉴스만 기존 페이지로 넘깁니다. 섹션 제목까지 같이 보고 판단합니다.
        var AMBIGUOUS = {
          더보기: { "뉴스 · 공지": "/bnviit/news" },
        };

        var wantsSpa =
          /[?&]spa(?:[=&]|$)/.test(window.location.search) ||
          window.location.hash === "#spa";

        if (wantsSpa) {
          bootSpa();
        } else {
          showFrontpage();
        }

        function bootSpa() {
          addStylesheet(FONT_CSS, false);
          addStylesheet(SPA_CSS, true);

          var s = document.createElement("script");
          s.type = "module";
          s.crossOrigin = "anonymous";
          s.src = SPA_JS;
          document.body.appendChild(s);
        }

        function showFrontpage() {
          document.body.classList.add("frontpage-mode");

          var frame = document.createElement("iframe");
          frame.className = "frontpage";
          frame.title = "비앤빛안과 프런트페이지";
          frame.src = "./frontpage.html";
          // frontpage.html 은 로드 후 documentElement 를 통째로 교체하지만
          // document 노드 자체는 유지되므로, 위임 리스너는 살아남습니다.
          frame.addEventListener("load", function () {
            try {
              wireLinks(frame.contentDocument);
            } catch (err) {
              console.warn("[frontpage] 링크 연결 실패:", err);
            }
          });
          document.body.appendChild(frame);

          var link = document.createElement("a");
          link.className = "proto-link";
          link.href = "?spa";
          link.textContent = "기존 프로토타입 보기";
          document.body.appendChild(link);
        }

        function wireLinks(doc) {
          if (!doc) return;
          doc.addEventListener(
            "click",
            function (e) {
              var route = resolve(e.target, doc);
              if (!route) return;
              // 캡처 단계에서 멈춰 와이어프레임 자체 화면 전환을 막습니다.
              e.preventDefault();
              e.stopPropagation();
              window.location.href = SPA_BASE + route;
            },
            true
          );
        }

        // ── resolver:start (테스트 하네스가 이 블록을 그대로 가져다 씁니다) ──
        //
        // 클릭 지점에서 최대 5단계까지 거슬러 올라가며 라벨을 찾습니다.
        // 라벨은 클릭 요소 자신일 수도 있고(칩·버튼), 배지와 나란히 놓인
        // 자식일 수도 있어(메뉴 항목 + '로그인' 배지) 양쪽을 모두 훑습니다.
        //
        // 단, 경로상에 실제로 클릭 가능한 요소가 하나도 없으면 무시합니다.
        // 그렇지 않으면 매핑된 라벨과 글자가 같은 '제목 텍스트'를 눌렀을 때도
        // 페이지가 이동해버립니다 (예: '뉴스 · 공지' 섹션 제목).
        function resolve(el, doc) {
          var clickable = false;
          var route = null;

          for (var i = 0; i < 5 && el && el !== doc; i++) {
            if (isClickable(el)) clickable = true;

            if (route === null) {
              var label = normalize(el.textContent);
              if (Object.prototype.hasOwnProperty.call(LINKS, label)) {
                route = LINKS[label];
              } else if (AMBIGUOUS[label]) {
                route = bySection(el, AMBIGUOUS[label]);
              }
            }
            el = el.parentElement;
          }
          return clickable ? route : null;
        }

        // 겹치는 라벨은 조상으로 올라가며 섹션 제목으로 목적지를 가립니다.
        function bySection(el, table) {
          for (var i = 0; i < 3 && el; i++) {
            el = el.parentElement;
            if (!el) break;
            var text = normalize(el.textContent);
            for (var key in table) {
              if (text.indexOf(key) === 0) return table[key];
            }
          }
          return null;
        }

        function isClickable(el) {
          if (!el || !el.ownerDocument || !el.ownerDocument.defaultView)
            return false;
          var view = el.ownerDocument.defaultView;
          return view.getComputedStyle(el).cursor === "pointer";
        }

        // 서브 항목은 '·  ' 접두사를 달고 렌더되고, 배지가 붙으면 공백이
        // 끼어들 수 있어 정규화해서 비교합니다.
        function normalize(text) {
          return String(text || "")
            .replace(/\s+/g, " ")
            .replace(/^[·•]\s*/, "")
            .trim();
        }
        // ── resolver:end ──

        function addStylesheet(href, crossOrigin) {
          var l = document.createElement("link");
          l.rel = "stylesheet";
          if (crossOrigin) l.crossOrigin = "anonymous";
          l.href = href;
          document.head.appendChild(l);
        }
      })();
    </script>
  </body>
</html>
